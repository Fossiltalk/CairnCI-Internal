# Dogfood caller: run the retrieve-org-metadata admin tool against this repo's
# own org. Reference example for consumers (see
# examples/caller-retrieve-org-metadata.yml).
#
# Unlike the example, this calls the LOCAL action (`uses: ./...`) rather than
# the published Fossiltalk/CairnCI-Public@v1, so it exercises whatever is on
# the branch you dispatch from — which is the point of dogfooding it here
# before the tool is ever published.
#
# Internal-only: this file is not in publish-tag.yml's PUBLISH_PATHS allowlist,
# so it never reaches CairnCI-Public.
#
# The job NEVER fails on a retrieval problem. Unretrievable metadata and failed
# chunks are reported as warnings and in the job summary, and a partial
# snapshot is still committed. Dispatch with fail-on-error: true to invert that
# while evaluating.
name: CI Retrieve Org Metadata

on:
  # No schedule yet — deliberately. A scheduled full-org retrieve pushes a
  # branch and can run for hours, so evaluate a manual run first, then add:
  #   schedule:
  #     - cron: "0 4 * * 0"   # weekly, Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      target-org:
        description: Org alias to snapshot.
        required: false
        default: target-org
      push:
        description: Push the snapshot branch. Set false for a dry run that commits locally and discards.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      skip-retrieve:
        description: Index and plan only — no retrieve, no branch. Fastest way to inspect chunking.
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      fail-on-error:
        description: Fail the job on retrieval problems instead of warning.
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write # the action pushes the snapshot branch

jobs:
  snapshot:
    name: Full org metadata snapshot
    if: github.repository == 'Fossiltalk/CairnCI-Internal'
    runs-on: ubuntu-latest
    environment: main # provides SFDX_AUTH_URL
    # A full retrieve of a large Industries / Public Sector org runs for hours.
    # GitHub's hard ceiling is 360 minutes; stop just short so the job reports
    # rather than being killed mid-commit.
    timeout-minutes: 350
    steps:
      # Full history: the action branches from the current commit, and a
      # shallow clone cannot push a new branch cleanly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        shell: bash
        run: npm install --global @salesforce/cli@latest

      # Same auth shape as sf-deploy.yml. The action reuses this session; it
      # never sees the secret itself and takes no credential inputs.
      - name: Authenticate to the org
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SFDX_AUTH_URL:-}" ]; then
            echo "::error::SFDX_AUTH_URL secret is empty or not set on the 'main' environment." >&2
            exit 1
          fi
          authfile="$(mktemp)"
          printf '%s' "$SFDX_AUTH_URL" > "$authfile"
          sf org login sfdx-url --sfdx-url-file "$authfile" --alias target-org --set-default
          rm -f "$authfile"

      - name: Retrieve full org metadata
        id: snapshot
        uses: ./.github/actions/retrieve-org-metadata
        with:
          target-org: ${{ inputs.target-org }}
          target-dir: force-app
          push: ${{ inputs.push }}
          skip-retrieve: ${{ inputs.skip-retrieve }}
          fail-on-error: ${{ inputs.fail-on-error }}

      - name: Report where the snapshot landed
        if: always()
        shell: bash
        # Step outputs come through env, not spliced into the script body —
        # interpolating a ${{ }} expression into shell is a script-injection
        # vector and a constant to shellcheck.
        env:
          BRANCH: ${{ steps.snapshot.outputs.branch-name }}
          COMPONENTS: ${{ steps.snapshot.outputs.total-components }}
          OK: ${{ steps.snapshot.outputs.chunks-succeeded }}
          FAILED: ${{ steps.snapshot.outputs.chunks-failed }}
          SKIPPED: ${{ steps.snapshot.outputs.types-unretrievable }}
        run: |
          set -euo pipefail
          echo "Branch:     ${BRANCH:-<none>}"
          echo "Components: ${COMPONENTS:-0}"
          echo "Chunks:     ${OK:-0} ok, ${FAILED:-0} failed"
          echo "Skipped:    ${SKIPPED:-0}"
          echo "Full detail is in the job summary above."
